name: Pull Request

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**
      - gradle/**
      - src/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradlew
      - gradlew.bat

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    uses: ./.github/workflows/build_and_test.yml
    with:
      pr_build: true
